<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>SAT VOCAB</h1>
      <form id="vocabform" class="vocabform">
        <input
          type="text"
          id="vocabinput"
          placeholder="Enter Your New Word"
          class="vocabinput"
        />
        <button type="submit">Add</button>
      </form>
      <table class="vocab-table">
        <thead>
          <tr>
            <th>Word</th>
            <th>Type</th>
            <th>Definition</th>
            <th>Example</th>
            <th>Synonyms</th>
            <th>Antonyms</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="wordlist"></tbody>
      </table>
    </div>
  </body>
  <script src="config.js"></script>

  <script src="main.js"></script>
</html>
