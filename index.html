<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>SAT VOCAB</h1>
      <form id="vocabform" class="vocabform">
        <input
          type="text"
          id="vocabinput"
          placeholder="Enter Your New Word"
          class="vocabinput"
        />
        <button type="submit">Add</button>
      </form>
      <div class="tabs">
        <button class="tab-btn active" data-tab="vocab">
          Vocabulary
        </button>
        <button class="tab-btn active" data-tab="practice">
          Practice
        </button>
      </div>
      <section id="vocab" class="tab-content active">
        <div class="filter">
          <button id="all" class="filter-btn">All</button>
          <button id="favoriteFillter" class="filter-btn">Favorites</button>
        </div>
        <table class="vocab-table">
          <thead>
            <tr>
              <th>Word</th>
              <th>Type</th>
              <th>Definition</th>
              <th>Example</th>
              <th>Synonyms</th>
              <th>Antonyms</th>
              <th>actions</th>
            </tr>
          </thead>
          <tbody id="wordlist"></tbody>
        </table>
      </section>

      <section id="practice" class="tab-content">
        <h2>Practice</h2>
        <select id="questionCount">
          <option>5 Q</option>
          <option selected>10 Q</option>
          <option>15 Q</option>
          <option>All Favorite Q</option>
        </select>
        <button id="generateQustions">Generate Qustions</button>
      </section>
    </div>
  </body>
  <script src="config.js"></script>

  <script src="main.js"></script>
</html>
